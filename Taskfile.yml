# https://taskfile.dev
version: '3'

vars:
  BENCH_TIME: 2s

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run all tests (verbose)
    cmds:
      - go test -v ./...

  test:short:
    desc: Run all tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:noasm:
    desc: Run the race tests against the scalar fallback (-tags noasm)
    cmds:
      - go test -race -tags noasm ./...

  bench:
    desc: Run all benchmarks
    cmds:
      - go test -bench=. -benchmem -benchtime={{.BENCH_TIME}} ./...

  vet:
    desc: Run go vet for amd64 and arm64, both tag settings
    cmds:
      - GOARCH=amd64 go vet ./...
      - GOARCH=arm64 go vet ./...
      - GOARCH=amd64 go vet -tags noasm ./...
      - GOARCH=arm64 go vet -tags noasm ./...

  lint:
    desc: Run golangci-lint for both tag settings
    cmds:
      - golangci-lint run ./...
      # The noasm files are invisible to the default run, so a violation in
      # them only shows up here and in CI's lint matrix.
      - golangci-lint run --build-tags noasm ./...

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify

  hooks:install:
    desc: Point git at the repo's .githooks directory
    cmds:
      - git config core.hooksPath .githooks

  check:
    desc: Full local gate (build, vet, lint, race tests, noasm race tests)
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: test:race
      # CI vets, lints and tests both tag settings, so the local gate does too;
      # a noasm-only failure is otherwise invisible until push.
      - task: test:noasm
